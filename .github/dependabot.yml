version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript < 6.1; drop this once it
      # supports 7.x.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # One PR for routine minor/patch bumps; majors arrive separately.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
